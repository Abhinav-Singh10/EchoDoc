syntax = "proto3";

package collab.system.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service SystemService {
  rpc GetServerInfo(google.protobuf.Empty) returns (ServerInfo);
  rpc GetClusterInfo(google.protobuf.Empty) returns (ClusterInfo);
  rpc WatchEvents(google.protobuf.Empty) returns (stream ServerEvent);
}

message ClusterInfo {
  string responding_server_id = 1;
  repeated ClusterNodeStatus nodes = 2;
}

message ClusterNodeStatus {
  string node_id = 1;
  oneof result {
    ServerInfo info = 2;
    NodeStatusError error = 3;
  }
}

message NodeStatusError {
  string code = 1;
  string message = 2;
}

message ServerInfo {
  string server_id = 1;
  string process_instance_id = 2;
  string application_version = 3;
  double uptime_seconds = 4;
  string raft_role = 5;
  uint64 raft_term = 6;
  string raft_leader_id = 7;
  uint64 raft_last_log_index = 8;
  uint64 raft_commit_index = 9;
  uint64 raft_last_applied = 10;
}

message ServerEvent {
  string process_instance_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp server_timestamp = 3;
}
