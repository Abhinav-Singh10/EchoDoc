syntax = "proto3";

package collab.raft.v1;

// Fixed-membership Raft, with deterministic document and session application.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc ReadBarrier(ReadBarrierRequest) returns (ReadBarrierResponse);
}

message ReadBarrierRequest {
  string requester_id = 1;
}

message ReadBarrierResponse {
  uint64 read_index = 1;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  uint64 leader_commit = 5;
  repeated LogEntry entries = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;
}

// Prepared values; replicas never generate new IDs, tokens, or expiry times.
message Command {
  oneof command {
    CreateDocumentCommand create_document = 1;
    SubmitUpdateCommand submit_update = 2;
    NoOpCommand no_op = 3;
    CreateSessionCommand create_session = 4;
    RevokeSessionCommand revoke_session = 5;
  }
}

message NoOpCommand {}

message CreateSessionCommand {
  string token = 1;
  string user_id = 2;
  string username = 3;
  int64 expires_at = 4;
}

message RevokeSessionCommand {
  string token = 1;
}

message CreateDocumentCommand {
  string document_id = 1;
  string title = 2;
  bytes state = 3;
}

message SubmitUpdateCommand {
  string document_id = 1;
  string request_id = 2;
  string author = 3;
  bytes update = 4;
}
