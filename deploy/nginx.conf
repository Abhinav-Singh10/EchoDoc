server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /rpc/ {
        proxy_pass http://envoy:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }
}
